<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="row">
            <div class="col">
                <h2>Cadastre-se</h2>
                <form class="form-format">
                    <label for="nome" class="form-label">Nome:</label>
                    <input id="nome" class="form-control mb-3"type="text"/>
                    <label for="email" class="form-label">E-mail:</label>
                    <input id="email" class="form-control mb-3" type="email">
                    <label for="telefone" class="form-label">Telefone:</label>
                    <input id="telefone" class="form-control mb-3" type="tel">
                    <button class="btn btn-success btn-sm">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
